apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: changelog-client
  namespace: changelog-controller
spec:
  host: changelog-client.apps.engineering.openshift.org
  to:
    kind: Service
    name: changelog-client
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
