apiVersion: apps/v1
kind: Deployment
metadata:
  name: changelog-client
  namespace: changelog-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: changelog-client
  template:
    metadata:
      labels:
        app: changelog-client
    spec:
      serviceAccountName: changelog-controller
      containers:
        - name: changelog-client
          image: image-registry.openshift-image-registry.svc:5000/changelog-controller/changelog-client:latest
          args:
            - "--release-controller-url=https://amd64.ocp.releases.ci.openshift.org"
            - "--changelog-controller-url=https://changelog.apps.engineering.openshift.org"
            - "--port=8080"
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
